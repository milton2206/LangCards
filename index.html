<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1115" />
    <meta
      name="description"
      content="Карточки — учи иностранные слова в контексте живых примеров."
    />

    <!-- Шрифты Ember (Google Fonts): Alegreya Sans — слова и заголовки,
         Fira Sans — интерфейс. Оба семейства несут латиницу, кириллицу и
         греческий: css2 без &text= отдаёт @font-face для всех подмножеств с
         unicode-range, браузер тянет нужное по факту использования. На этом
         шаге шрифты только ПОДКЛЮЧЕНЫ (доступны как токены --font-word/-ui),
         но ни к одному экрану ещё не применены. display=swap — без «невидимого»
         текста, при отсутствии сети экраны падают на системный шрифт как сейчас. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Fira+Sans:wght@400;500;700&display=swap"
    />

    <!-- PWA: установка на главный экран и полноэкранный режим -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Карточки" />

    <title>Карточки — учи слова в контексте</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
